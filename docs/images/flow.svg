<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 128" role="img" aria-label="Install, CONNECT, SCAN, use">
  <defs>
    <style>
      .card { fill: #0d1117; stroke: #30363d; stroke-width: 1.4; }
      .ring { fill: none; stroke: #ffb000; stroke-width: 1.6; }
      .n { fill: #ffb000; font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
      .t { fill: #e6edf3; font: 650 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
      .s { fill: #8b949e; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; }
      .arr { fill: #ffb000; font: 20px ui-monospace, Menlo, monospace; }
    </style>
  </defs>
  <rect width="760" height="128" rx="12" fill="#010409"/>
  <g transform="translate(16,24)">
    <rect class="card" width="156" height="80" rx="10"/>
    <circle class="ring" cx="78" cy="26" r="14"/>
    <text class="n" x="78" y="31">1</text>
    <text class="t" x="78" y="54">Install</text>
    <text class="s" x="78" y="70">./scripts/build.sh</text>
  </g>
  <text class="arr" x="180" y="76">?</text>
  <g transform="translate(204,24)">
    <rect class="card" width="156" height="80" rx="10"/>
    <circle class="ring" cx="78" cy="26" r="14"/>
    <text class="n" x="78" y="31">2</text>
    <text class="t" x="78" y="54">CONNECT</text>
    <text class="s" x="78" y="70">menubar icon</text>
  </g>
  <text class="arr" x="368" y="76">?</text>
  <g transform="translate(392,24)">
    <rect class="card" width="156" height="80" rx="10"/>
    <circle class="ring" cx="78" cy="26" r="14"/>
    <text class="n" x="78" y="31">3</text>
    <text class="t" x="78" y="54">SCAN</text>
    <text class="s" x="78" y="70">CFG ? best DPI</text>
  </g>
  <text class="arr" x="556" y="76">?</text>
  <g transform="translate(580,24)">
    <rect class="card" width="164" height="80" rx="10"/>
    <circle class="ring" cx="82" cy="26" r="14"/>
    <text class="n" x="82" y="31">4</text>
    <text class="t" x="82" y="54">Use</text>
    <text class="s" x="82" y="70">YouTube + Telegram</text>
  </g>
</svg>
